services:
  booking-node:
    build:
      context: ./services/BookingServer
      dockerfile: Dockerfile
    image: booking-node:local
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./services/BookingServer:/app:delegated
      - /app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "require('fs').existsSync('./bookingServer.js') ? process.exit(0) : process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  apartments-dotnet:
    build:
      context: ./services/BoscoStay.ApartmentsManagement
      dockerfile: BoscoStay.ApartmentsManagement/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    image: apartments-dotnet:local
    ports:
      - "8082:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./services/BoscoStay.ApartmentsManagement:/src:delegated
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  java-service:
    build:
      context: ./services/BoscoStay.SearchService
      dockerfile: Dockerfile
    image: java-service:local
    ports:
      - "8083:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  default:
    name: master_local_network