version: "3.8"

services:

  # ---------------------------
  # PostgreSQL for Search Service
  # ---------------------------
  search-postgres:
    image: postgres:15
    container_name: search-postgres
    environment:
      POSTGRES_USER: searchuser
      POSTGRES_PASSWORD: searchpass
      POSTGRES_DB: searchdb
    ports:
      - "5433:5432"
    volumes:
      - search_postgres_data:/var/lib/postgresql/data
    restart: always

  # ---------------------------
  # RabbitMQ (Message Broker)
  # ---------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  # ---------------------------
  # Booking Service (Node.js)
  # ---------------------------
  booking-node:
    build:
      context: ./services/BookingServer
      dockerfile: Dockerfile
    image: booking-node:local
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./services/BookingServer:/app:delegated
      - /app/node_modules
    depends_on:
      - rabbitmq
    restart: always

  # ---------------------------
  # Apartments Service (.NET)
  # ---------------------------
  apartments-dotnet:
    build:
      context: ./services/BoscoStay.ApartmentsManagement
      dockerfile: BoscoStay.ApartmentsManagement/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    image: apartments-dotnet:local
    ports:
      - "8082:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./services/BoscoStay.ApartmentsManagement:/src:delegated
    restart: always

  # ---------------------------
  # Search Service (Spring Boot)
  # ---------------------------
  java-service:
    build:
      context: ./services/BoscoStay.SearchService
      dockerfile: Dockerfile
    image: java-service:local
    ports:
      - "8083:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    # depends_on:
    #   - search-postgres
    #   - rabbitmq
    restart: always

# ---------------------------
# Volumes
# ---------------------------
volumes:
  search_postgres_data:

# ---------------------------
# Network
# ---------------------------
networks:
  default:
    name: master_local_network