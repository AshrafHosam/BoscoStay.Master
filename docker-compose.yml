#version: "3.8"

services:
  apartments-postgres:
    image: postgres:15
    container_name: bstay-apartments-postgres
    environment:
      POSTGRES_USER: apartment-postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: BoscoStay
    ports:
      - "5434:5432"
    volumes:
      - apartments_postgres_data:/var/lib/postgresql/data
    restart: always

  search-postgres:
    image: postgres:15
    container_name: bstay-search-postgres
    environment:
      POSTGRES_USER: searchuser
      POSTGRES_PASSWORD: searchpass
      POSTGRES_DB: searchdb
    ports:
      - "5433:5432"
    volumes:
      - search_postgres_data:/var/lib/postgresql/data
    restart: always

  api-gateway:
    image: nginx:latest
    container_name: bstay-api-gateway
    ports:
      - "80:80"
    volumes:
      - ./services/gateway/entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      - booking-node
      - apartments-dotnet
      - java-service
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: always

  # ---------------------------
  # RabbitMQ (Message Broker)
  # ---------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: bstay-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    logging:
      driver: "none"
    restart: always

  # ---------------------------
  # Booking Service (Node.js)
  # ---------------------------
  booking-node:
    build:
      context: ./services/BookingServer
      dockerfile: Dockerfile
    image: booking-node:local
    container_name: bstay-booking-service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    logging:
      driver: "none"    
    volumes:
      - ./services/BookingServer:/app:delegated
      - /app/node_modules
    depends_on:
    - rabbitmq
    - apartments-dotnet
    restart: always

  # ---------------------------
  # Apartments Service (.NET)
  # ---------------------------
  apartments-dotnet:
    build:
      context: ./services/BoscoStay.ApartmentsManagement
      dockerfile: BoscoStay.ApartmentsManagement/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    image: apartments-dotnet:local
    container_name: bstay-apartments-service
    ports:
      - "8082:8080"
    depends_on:
      - apartments-postgres
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./services/BoscoStay.ApartmentsManagement:/src:delegated
    restart: always

  # ---------------------------
  # Search Service (Spring Boot)
  # ---------------------------
  java-service:
    build:
      context: ./services/BoscoStay.SearchService
      dockerfile: Dockerfile
    image: java-service:local
    container_name: bstay-search-service
    ports:
      - "8083:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    logging:
      driver: "none"
    depends_on:
      - search-postgres
      - apartments-dotnet
    restart: always

# ---------------------------
# Volumes
# ---------------------------
volumes:
  search_postgres_data:
  apartments_postgres_data:

# ---------------------------
# Network
# ---------------------------
networks:
  default:
    name: master_local_network
